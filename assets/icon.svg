    </linearGradient>
    <linearGradient id="arch" x1="56" y1="108" x2="204" y2="156" gradientUnits="userSpaceOnUse">
      <stop stop-color="#51E8CD"/>
      <stop offset="0.48" stop-color="#45D6F2"/>
